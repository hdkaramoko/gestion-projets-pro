{% extends "base.html" %}
{% block auth_content %}
<div class="bg-white border rounded-4 p-4">
  <h1 class="h3">Choisir un nouveau mot de passe</h1>
  {% if validlink %}
    <form method="post">
      {% include "components/form.html" %}
      <button class="btn btn-primary w-100" type="submit">Enregistrer</button>
    </form>
  {% else %}
    <p>Ce lien est invalide ou a expiré.</p>
  {% endif %}
</div>
{% endblock %}
